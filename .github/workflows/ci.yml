name: Core CI (Server & Mobile)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-ci:
    name: Server API (Fastify & PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_ephemeral_test_password' }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB || 'omni_hr_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations & seed
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgres://postgres:ci_ephemeral_test_password@localhost:5432/omni_hr_test' }}

      - name: Run server integration tests
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgres://postgres:ci_ephemeral_test_password@localhost:5432/omni_hr_test' }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci_ephemeral_jwt_secret_test_only' }}
          JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci_ephemeral_jwt_refresh_secret_test_only' }}

      - name: Build & typecheck server
        run: npm run build
